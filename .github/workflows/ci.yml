name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Компиляция
        run: python3 -m py_compile watcher.py

      - name: CLI доступен
        run: python3 watcher.py --help

      - name: Базовый самотест
        run: python3 tests/selftest.py

      - name: Синтаксис install.sh
        if: matrix.python-version == '3.12'
        run: bash -n install.sh
